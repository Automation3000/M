    <script>
      // Safeguard: Ensure window.fetch is writable and configurable so extensions/test runners
      // (such as executors/200.js) can set window.fetch without throwing
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              writable: true,
              value: window.fetch
            });
          } catch (_) {}
        }
      })();
    </script>
